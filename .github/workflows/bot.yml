name: Run Minecraft Bot

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/30 * * * *' # يعيد تشغيل البوت كل 30 دقيقة ليظل نشطاً دائماً
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Start Bot
      run: node index.js
